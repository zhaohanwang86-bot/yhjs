spring.application.name=yhjs-spring-server
server.port=${PORT:49996}
server.address=0.0.0.0
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:yhjs}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=10000&socketTimeout=60000&autoReconnect=true&rewriteBatchedStatements=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# ---------- 数据库连接池（并发能力关键：单实例可并行的 DB 操作数） ----------
# 单实例理论 QPS ≈ maximum-pool-size ÷ 单请求 DB 耗时
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:30}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:10}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=600000
# 连接最长存活 30 分钟，避免 DB 侧连接老化/被中间件断开
spring.datasource.hikari.max-lifetime=1800000
# 连接被占用超过 20s 打警告，便于发现泄漏或慢查询
spring.datasource.hikari.leak-detection-threshold=20000
spring.datasource.hikari.initialization-fail-timeout=-1

# ---------- Tomcat 并发线程（HTTP 请求处理并发度） ----------
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:200}
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=200

# ---------- 运行指标（压测/调优用） ----------
# 生产如需收紧，可改为仅 health，或在网关层限制 /actuator 访问
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always

spring.jackson.time-zone=Asia/Shanghai

# DeepSeek AI 客服（默认内置本地联调 key；云端部署请用环境变量 AI_API_KEY 覆盖）
ai.api-key=${AI_API_KEY:sk-8a796534f27e47fc87b090d548ca2ffd}
ai.model=${AI_MODEL:deepseek-v4-flash}

# 静态资源：本地联调读 yhjs/ 根目录旧网页；若 jar 内 src/main/resources/static 放入 web-vue 构建产物，云端也能直接托管 Vue 前端
spring.web.resources.static-locations=file:../,classpath:/static/

